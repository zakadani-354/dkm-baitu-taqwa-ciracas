<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DKM MASJID BAITUT TAQWA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ivory:'#F4EFE8',surface:'#FAF8F5',sage:'#667F6E',moss:'#A7B6A7',mist:'#D9DFD9',sand:'#C9BDAF',charcoal:'#2C332E',muted:'#6E7570'}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="loadingOverlay" class="fixed inset-0 z-[90] bg-ivory/80 backdrop-blur-sm hidden items-center justify-center">
    <div class="card px-6 py-5 flex items-center gap-3"><div class="spinner"></div><span class="text-sm font-medium">Memuat data...</span></div>
  </div>
  <div id="toast" class="toast"><span id="toastText"></span></div>
  <div id="loginModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-charcoal/25 p-4">
    <div class="card w-full max-w-md p-6">
      <div class="flex items-start justify-between">
        <div><p class="text-xs uppercase tracking-widest text-muted">Akses Pengurus</p><h2 class="mt-1 text-xl font-semibold">Masuk ke DKM</h2></div>
        <button type="button" onclick="Auth.closeLogin()" class="text-muted p-2" aria-label="Tutup"><i data-lucide="x"></i></button>
      </div>
      <form id="loginForm" class="mt-6 space-y-4">
        <div><label class="text-sm text-muted">Username</label><input id="loginUsername" class="input mt-1" autocomplete="username" required></div>
        <div><label class="text-sm text-muted">Password</label><input id="loginPassword" type="password" class="input mt-1" autocomplete="current-password" required></div>
        <p id="loginError" class="text-sm text-red-700"></p>
        <button class="btn-primary w-full" type="submit">Masuk</button>
      </form>
    </div>
  </div>

  <div class="flex min-h-screen">
    <aside class="sidebar fixed inset-y-0 left-0 z-40 hidden md:flex flex-col border-r border-[#E6E0D6] bg-[#F8F4ED] p-5">
      <div class="flex items-center gap-3 px-2 mb-7">
        <div id="sidebarLogo" class="grid h-11 w-11 place-items-center rounded-full bg-sage text-white"><i data-lucide="mosque"></i></div>
        <div><p class="text-xs text-muted">DKM</p><p class="text-sm font-semibold leading-tight">Baitut Taqwa</p></div>
      </div>
      <nav id="sidebarNav" class="space-y-1"></nav>
      <div class="mt-auto border-t border-[#E6E0D6] pt-4">
        <div id="userBadge" class="px-2 text-xs text-muted mb-3"></div>
        <button id="logoutBtn" class="nav-item w-full hide-for-role"><i data-lucide="log-out"></i>Keluar</button>
      </div>
    </aside>
    <main id="app" class="desktop-main ml-0 min-h-screen w-full md:ml-[250px] px-4 py-5 md:px-8 md:py-7"></main>
  </div>
  <nav id="bottomNav" class="bottom-nav fixed bottom-3 left-3 right-3 z-50 hidden grid-cols-5 rounded-2xl border border-[#E6E0D6] bg-surface/95 p-1 shadow-lg backdrop-blur"></nav>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/jamaah.js"></script>
  <script src="js/presensi.js"></script>
  <script src="js/materi.js"></script>
  <script src="js/program.js"></script>
  <script src="js/akun.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
