<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4EFE8">
  <title>DKM MASJID BAITU TAQWA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{ivory:'#F4EFE8',surface:'#FAF8F5',sage:'#667F6E',moss:'#A7B6A7',mist:'#D9DFD9',sand:'#C9BDAF',charcoal:'#2C332E',muted:'#6E7570'}}}}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="loading" class="loading-screen" hidden><span class="spinner"></span><span id="loadingText">Memuat...</span></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="loginModal" class="modal-backdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <button class="icon-button modal-close" type="button" data-action="close-login" aria-label="Tutup"><i data-lucide="x"></i></button>
      <p class="eyebrow">Area Pengurus</p><h2 id="loginTitle" class="text-2xl font-semibold">Masuk ke DKM</h2>
      <p class="mt-2 text-sm text-muted">Gunakan username dan password akun masjid.</p>
      <form id="loginForm" class="mt-6 space-y-4">
        <label class="field-label">Username<input id="loginUsername" class="input mt-1" autocomplete="username" required></label>
        <label class="field-label">Password<input id="loginPassword" class="input mt-1" type="password" autocomplete="current-password" required></label>
        <p id="loginError" class="form-error" aria-live="polite"></p>
        <button class="btn-primary w-full" type="submit">Masuk</button>
      </form>
    </section>
  </div>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="app" class="main-content"><div class="page-skeleton"><span class="spinner"></span></div></main>
  </div>
  <nav id="bottomNav" class="bottom-nav" aria-label="Navigasi utama"></nav>

  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/jamaah.js"></script>
  <script src="js/presensi.js"></script>
  <script src="js/materi.js"></script>
  <script src="js/program.js"></script>
  <script src="js/akun.js"></script>
</body>
</html>
